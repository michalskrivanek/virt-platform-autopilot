apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubevirt-metrics-exporter-alerts
  namespace: kubevirt-metrics-exporter
  labels:
    app.kubernetes.io/name: kubevirt-metrics-exporter
spec:
  groups:
    # Preserve individual workload alerts alongside storage-class summaries.
    # Intermediate records retain identity without requiring PVC metadata.
    # Read/write and block summaries use >1% above 100ms; compare increases
    # directly to avoid rate-conversion rounding at an exactly 1% tail.
    # Flush/NFS retain estimated P99 thresholds of 500ms/250ms. Quantiles use
    # all buckets and accept both 1 and 1.0 as the one-second boundary.
    # Histogram summaries require >=100 operations per disk/pod-volume in 5m,
    # except flush, which uses its 10m P99 window.
    - name: kubevirt-storage-io.rules
      rules:
        - record: pod:kme_vmi:info
          expr: |
            label_replace(
              max by (namespace, vmi_pod, name) (
                last_over_time(kubevirt_vmi_info{phase="running",vmi_pod!=""}[5m])
              ),
              "pod", "$1", "vmi_pod", "(.*)"
            )

        - record: vmi:kme_vmi_io_latency_affected:bool
          expr: |
            group without () (
              (
                sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                  increase(kubevirt_vmi_storage_io_latency_seconds_bucket{operation=~"read|write",le="0.1"}[5m])
                )
                /
                sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                  increase(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
                )
              ) < 0.99
              and
              (sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                increase(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100)
            )

        - record: vmi:kme_vmi_io_latency_active:bool
          expr: |
            group without () (
              sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                increase(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100
            )

        - record: vmi:kme_vmi_flush_latency:p99_seconds
          expr: |
            histogram_quantile(0.99, sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation, le) (
              increase(kubevirt_vmi_storage_io_latency_seconds_bucket{operation="flush"}[10m])
            ))

        - record: vmi:kme_vmi_flush_latency_affected:bool
          expr: |
            group without () (
              (vmi:kme_vmi_flush_latency:p99_seconds > 0.5)
              and
              (sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                increase(kubevirt_vmi_storage_io_latency_seconds_count{operation="flush"}[10m])
              ) >= 100)
            )

        - record: vmi:kme_vmi_flush_latency_active:bool
          expr: |
            group without () (
              sum by (namespace, name, node, pod, disk, persistentvolumeclaim, operation) (
                increase(kubevirt_vmi_storage_io_latency_seconds_count{operation="flush"}[10m])
              ) >= 100
            )

        - record: pod:kme_block_latency:p99_seconds
          expr: |
            histogram_quantile(0.99, sum by (namespace, node, persistentvolumeclaim, pod, operation, le) (
              rate(kme_block_io_latency_seconds_bucket{operation=~"read|write"}[5m])
            ))

        - record: pod:kme_block_io_latency_affected:bool
          expr: |
            group without () (
              (
                sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                  increase(kme_block_io_latency_seconds_bucket{operation=~"read|write",le="0.1"}[5m])
                )
                /
                sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                  increase(kme_block_io_latency_seconds_count{operation=~"read|write"}[5m])
                )
              ) < 0.99
              and
              (sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                increase(kme_block_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100)
            )

        - record: vmi:kme_block_io_latency_affected:bool
          expr: |
            group without () (
              pod:kme_block_io_latency_affected:bool
              * on (namespace, pod) group_left(name)
                pod:kme_vmi:info
            )

        - record: pod:kme_block_io_latency_active:bool
          expr: |
            group without () (
              sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                increase(kme_block_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100
            )

        - record: vmi:kme_block_io_latency_active:bool
          expr: |
            group without () (
              pod:kme_block_io_latency_active:bool
              * on (namespace, pod) group_left(name)
                pod:kme_vmi:info
            )

        - record: pod:kme_nfs_latency:p99_seconds
          expr: |
            histogram_quantile(0.99, sum by (namespace, node, persistentvolumeclaim, pod, operation, le) (
              increase(kme_nfs_io_latency_seconds_bucket{operation=~"read|write"}[5m])
            ))

        - record: pod:kme_nfs_io_latency_affected:bool
          expr: |
            group without () (
              (pod:kme_nfs_latency:p99_seconds > 0.25)
              and
              (sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                increase(kme_nfs_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100)
            )

        - record: vmi:kme_nfs_io_latency_affected:bool
          expr: |
            group without () (
              pod:kme_nfs_io_latency_affected:bool
              * on (namespace, pod) group_left(name)
                pod:kme_vmi:info
            )

        - record: pod:kme_nfs_io_latency_active:bool
          expr: |
            group without () (
              sum by (namespace, node, pod, persistentvolumeclaim, operation) (
                increase(kme_nfs_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) >= 100
            )

        - record: vmi:kme_nfs_io_latency_active:bool
          expr: |
            group without () (
              pod:kme_nfs_io_latency_active:bool
              * on (namespace, pod) group_left(name)
                pod:kme_vmi:info
            )

        - record: vmi:kme_guest_latency_affected:bool
          expr: |
            group without () (kubevirt_vmi_storage_guest_latency_avg_seconds > 0.1)

        - record: vmi:kme_guest_latency_active:bool
          expr: |
            group without () (kubevirt_vmi_storage_guest_latency_avg_seconds)

        # The node signal retains its original combined-disk/read-write P99
        # and positive-activity denominator, independent of summary floors.
        - record: vmi:kme_node_io_latency:p99_seconds
          expr: |
            histogram_quantile(0.99, sum by (namespace, name, node, le) (
              rate(kubevirt_vmi_storage_io_latency_seconds_bucket{operation=~"read|write"}[5m])
            ))

        - record: vmi:kme_node_io_latency_active:bool
          expr: |
            group without () (
              sum by (namespace, name, node) (
                rate(kubevirt_vmi_storage_io_latency_seconds_count{operation=~"read|write"}[5m])
              ) > 0
            )

        - record: storageclass:kme_vmi_io_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_vmi_io_latency_affected:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{persistentvolumeclaim!="",storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_vmi_io_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_vmi_io_latency_active:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{persistentvolumeclaim!="",storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_vmi_flush_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_vmi_flush_latency_affected:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{persistentvolumeclaim!="",storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_vmi_flush_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_vmi_flush_latency_active:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{persistentvolumeclaim!="",storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_block_io_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_block_io_latency_affected:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{persistentvolumeclaim!="",storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_block_io_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_block_io_latency_active:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{persistentvolumeclaim!="",storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_nfs_io_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_nfs_io_latency_affected:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{persistentvolumeclaim!="",storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_nfs_io_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_nfs_io_latency_active:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{persistentvolumeclaim!="",storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_guest_latency_affected:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_guest_latency_affected:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{persistentvolumeclaim!="",storageclass!=""}
                  )
              )
            )

        - record: storageclass:kme_guest_latency_active:count
          expr: |
            count by (storageclass, operation) (
              group by (namespace, name, storageclass, operation) (
                vmi:kme_guest_latency_active:bool
                * on (namespace, persistentvolumeclaim) group_left(storageclass)
                  max by (namespace, persistentvolumeclaim, storageclass) (
                    kube_persistentvolumeclaim_info{persistentvolumeclaim!="",storageclass!=""}
                  )
              )
            )

    - name: kubevirt-storage-io
      rules:
        - alert: StorageClassVMILatencyHigh
          expr: |
            storageclass:kme_vmi_io_latency_affected:count
            and on (storageclass, operation) (
              storageclass:kme_vmi_io_latency_affected:count >= 10
              or on (storageclass, operation) (
                (
                  storageclass:kme_vmi_io_latency_affected:count
                  / on (storageclass, operation)
                  storageclass:kme_vmi_io_latency_active:count
                ) >= 0.1
                and on (storageclass, operation)
                storageclass:kme_vmi_io_latency_affected:count >= 3
              )
            )
          for: 10m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "High {{ $labels.operation }} latency on storage class {{ $labels.storageclass }}"
            description: "{{ $value | humanize }} VMIs on storage class {{ $labels.storageclass }} have more than 1% of {{ $labels.operation }} operations slower than 100ms. Fires when at least 10 VMIs are affected, or at least 10% of active VMIs are affected and at least 3 are affected."

        - alert: StorageClassVMIFlushLatencyHigh
          expr: |
            storageclass:kme_vmi_flush_latency_affected:count
            and on (storageclass, operation) (
              storageclass:kme_vmi_flush_latency_affected:count >= 10
              or on (storageclass, operation) (
                (
                  storageclass:kme_vmi_flush_latency_affected:count
                  / on (storageclass, operation)
                  storageclass:kme_vmi_flush_latency_active:count
                ) >= 0.1
                and on (storageclass, operation)
                storageclass:kme_vmi_flush_latency_affected:count >= 3
              )
            )
          for: 10m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "High flush latency on storage class {{ $labels.storageclass }}"
            description: "{{ $value | humanize }} VMIs on storage class {{ $labels.storageclass }} have estimated P99 flush latency above 500ms. Durability-sensitive workloads on this storage will see slow commits. Fires when at least 10 VMIs are affected, or at least 10% of active VMIs are affected and at least 3 are affected."

        - alert: StorageClassBlockLatencyHigh
          expr: |
            storageclass:kme_block_io_latency_affected:count
            and on (storageclass, operation) (
              storageclass:kme_block_io_latency_affected:count >= 10
              or on (storageclass, operation) (
                (
                  storageclass:kme_block_io_latency_affected:count
                  / on (storageclass, operation)
                  storageclass:kme_block_io_latency_active:count
                ) >= 0.1
                and on (storageclass, operation)
                storageclass:kme_block_io_latency_affected:count >= 3
              )
            )
          for: 10m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "High block {{ $labels.operation }} latency on storage class {{ $labels.storageclass }}"
            description: "{{ $value | humanize }} VMIs on storage class {{ $labels.storageclass }} have more than 1% of block {{ $labels.operation }} operations slower than 100ms. Fires when at least 10 VMIs are affected, or at least 10% of active VMIs are affected and at least 3 are affected."

        - alert: StorageClassNFSLatencyHigh
          expr: |
            storageclass:kme_nfs_io_latency_affected:count
            and on (storageclass, operation) (
              storageclass:kme_nfs_io_latency_affected:count >= 10
              or on (storageclass, operation) (
                (
                  storageclass:kme_nfs_io_latency_affected:count
                  / on (storageclass, operation)
                  storageclass:kme_nfs_io_latency_active:count
                ) >= 0.1
                and on (storageclass, operation)
                storageclass:kme_nfs_io_latency_affected:count >= 3
              )
            )
          for: 10m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "High NFS {{ $labels.operation }} latency on storage class {{ $labels.storageclass }}"
            description: "{{ $value | humanize }} VMIs on storage class {{ $labels.storageclass }} have estimated P99 NFS {{ $labels.operation }} latency above 250ms. Fires when at least 10 VMIs are affected, or at least 10% of active VMIs are affected and at least 3 are affected."

        - alert: StorageClassGuestLatencyHigh
          expr: |
            storageclass:kme_guest_latency_affected:count
            and on (storageclass, operation) (
              storageclass:kme_guest_latency_affected:count >= 10
              or on (storageclass, operation) (
                (
                  storageclass:kme_guest_latency_affected:count
                  / on (storageclass, operation)
                  storageclass:kme_guest_latency_active:count
                ) >= 0.1
                and on (storageclass, operation)
                storageclass:kme_guest_latency_affected:count >= 3
              )
            )
          for: 10m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "High guest {{ $labels.operation }} latency on storage class {{ $labels.storageclass }}"
            description: "{{ $value | humanize }} VMIs on storage class {{ $labels.storageclass }} have average guest {{ $labels.operation }} latency above 100ms. Fires when at least 10 VMIs are affected, or at least 10% of VMIs reporting guest latency on that storage class are affected and at least 3 are affected."

        - alert: VMIStorageWriteLatencyHigh
          expr: |
            histogram_quantile(0.99, sum by (namespace, name, node, pod, disk, persistentvolumeclaim, le) (
              rate(kubevirt_vmi_storage_io_latency_seconds_bucket{operation="write"}[5m])
            )) > 0.1
          for: 10m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt
            operator_health_impact: none
            operation: write
          annotations:
            summary: High P99 write latency for VM {{ $labels.namespace }}/{{ $labels.name }} disk {{ $labels.disk }}
            description: 'P99 hypervisor-side write latency for disk {{ $labels.disk }} on VM {{ $labels.namespace }}/{{ $labels.name }} has exceeded 100ms for 10 minutes (current value: {{ $value | humanizeDuration }}). Note: reported value is approximate due to histogram bucket granularity.'

        - alert: VMIStorageReadLatencyHigh
          expr: |
            histogram_quantile(0.99, sum by (namespace, name, node, pod, disk, persistentvolumeclaim, le) (
              rate(kubevirt_vmi_storage_io_latency_seconds_bucket{operation="read"}[5m])
            )) > 0.1
          for: 10m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt
            operator_health_impact: none
            operation: read
          annotations:
            summary: High P99 read latency for VM {{ $labels.namespace }}/{{ $labels.name }} disk {{ $labels.disk }}
            description: 'P99 hypervisor-side read latency for disk {{ $labels.disk }} on VM {{ $labels.namespace }}/{{ $labels.name }} has exceeded 100ms for 10 minutes (current value: {{ $value | humanizeDuration }}). Note: reported value is approximate due to histogram bucket granularity.'

        - alert: VMIStorageFlushLatencyHigh
          expr: vmi:kme_vmi_flush_latency:p99_seconds > 0.5
          for: 15m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt
            operator_health_impact: none
            operation: flush
          annotations:
            summary: High P99 flush latency for VM {{ $labels.namespace }}/{{ $labels.name }} disk {{ $labels.disk }}
            description: P99 flush latency for disk {{ $labels.disk }} on VM {{ $labels.namespace }}/{{ $labels.name }} has exceeded 500ms for 15 minutes. Durability-sensitive workloads (databases, journaling) using this disk will see slow commits/fsyncs.

        - alert: VMIGuestStorageLatencyHigh
          expr: |
            kubevirt_vmi_storage_guest_latency_avg_seconds > 0.1
          for: 15m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt
            operator_health_impact: none
          annotations:
            summary: Guest-side storage latency high on {{ $labels.namespace }}/{{ $labels.name }}
            description: Guest-observed average {{ $labels.operation }} latency for disk {{ $labels.disk }} on VM {{ $labels.namespace }}/{{ $labels.name }} has exceeded 100ms for 15 minutes.

        - alert: PVCBlockLatencyHigh
          expr: |
            pod:kme_block_latency:p99_seconds > 0.1
          for: 10m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
          annotations:
            summary: High block {{ $labels.operation }} latency for PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} (pod {{ $labels.pod }})
            description: P99 block {{ $labels.operation }} latency for PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} in pod {{ $labels.pod }} has exceeded 100ms for 10 minutes.

        - alert: PVCNFSLatencyHigh
          expr: |
            pod:kme_nfs_latency:p99_seconds > 0.25
          for: 10m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
          annotations:
            summary: High NFS {{ $labels.operation }} latency for PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} (pod {{ $labels.pod }})
            description: P99 NFS {{ $labels.operation }} latency for PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} in pod {{ $labels.pod }} has exceeded 250ms for 10 minutes.

        - alert: NodeVMStorageLatencyWidespread
          expr: |
            count by (node) (vmi:kme_node_io_latency:p99_seconds > 0.1)
            /
            count by (node) (vmi:kme_node_io_latency_active:bool) > 0.5
          for: 10m
          labels:
            severity: critical
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Widespread VM storage latency on node {{ $labels.node }}"
            description: >-
              More than 50% of active VMs on node {{ $labels.node }} have P99 storage
              I/O latency exceeding 100ms, suggesting a node- or storage-infrastructure
              problem rather than a single workload issue.

        - alert: VMIDiskSaturated
          expr: |
            sum by (namespace, name, node, disk, persistentvolumeclaim, bus) (
              kubevirt_vmi_storage_queue_inuse
            )
            /
            (
              sum by (namespace, name, node, disk, persistentvolumeclaim, bus) (
                kubevirt_vmi_storage_queue_size
              ) > 0
            ) > 0.9
          for: 5m
          labels:
            severity: critical
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt
            operator_health_impact: none
          annotations:
            summary: "Virtqueues saturated on {{ $labels.namespace }}/{{ $labels.name }} (bus={{ $labels.bus }}{{ if $labels.disk }}, disk={{ $labels.disk }}{{ end }})"
            description: >-
              Aggregate virtqueue occupancy (bus={{ $labels.bus }}{{ if $labels.disk }},
              disk={{ $labels.disk }}, PVC={{ $labels.persistentvolumeclaim }}{{ end }}) on VM
              {{ $labels.namespace }}/{{ $labels.name }} exceeds 90% across all
              queues, indicating sustained storage backpressure.

    - name: kubevirt-overhead
      rules:
        - alert: KSMDCPUHigh
          expr: |
            rate(kme_cgroup_ksmd_cpu_seconds_total[5m]) > 0.5
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "ksmd consuming >50% CPU on node {{ $labels.node }}"
            description: >-
              The ksmd kernel thread on node {{ $labels.node }} has been using
              more than 50% of a CPU core for over 10 minutes. This may indicate
              overly aggressive KSM scan parameters (pages_to_scan / sleep_millisecs)
              or a large volume of volatile pages causing excessive re-scanning.

        - alert: KhugepagedCPUHigh
          expr: |
            rate(kme_cgroup_khugepaged_cpu_seconds_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "khugepaged consuming >10% CPU on node {{ $labels.node }}"
            description: >-
              The khugepaged kernel thread on node {{ $labels.node }} has been
              using more than 10% of a CPU core for over 10 minutes. This may
              indicate excessive transparent huge page collapse activity, possibly
              due to a large number of VMs faulting memory simultaneously.

    # The job label must match the PodMonitor name in deploy/podmonitor/podmonitor.yaml.
    - name: kubevirt-metrics-exporter-health
      rules:
        - alert: KMEQMPPollStale
          expr: time() - kme_qmp_last_poll_timestamp_seconds > 150
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "QMP polling stale on {{ $labels.instance }}"
            description: >-
              The QMP subsystem has not completed a poll cycle in over 5 minutes.
              VM storage metrics from this node may be stale.

        - alert: KMEQGAPollStale
          expr: time() - kme_qga_last_poll_timestamp_seconds > 150
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "QGA polling stale on {{ $labels.instance }}"
            description: >-
              The QGA subsystem has not completed a poll cycle in over 5 minutes.
              Guest-side metrics from this node may be stale.

        - alert: KMEQMPScrapeErrors
          expr: |
            rate(kme_qmp_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Sustained QMP scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent QMP scrape errors
              (>0.1/s over 15 minutes). Some VMs may be missing storage metrics.

        - alert: KMEQGAScrapeErrors
          expr: |
            rate(kme_qga_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Sustained QGA scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent QGA scrape errors
              (>0.1/s over 15 minutes). Some VMs may be missing guest-side metrics.

        - alert: KMEKVMPollStale
          expr: time() - kme_kvm_last_poll_timestamp_seconds > 90
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "KVM polling stale on {{ $labels.instance }}"
            description: >-
              The KVM subsystem has not completed a poll cycle in over 90 seconds.
              KVM exit/hypercall metrics from this node may be stale.

        - alert: KMEKVMScrapeErrors
          expr: |
            rate(kme_kvm_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Sustained KVM scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent KVM debugfs scrape errors
              (>0.1/s over 15 minutes). Some VMs may be missing KVM metrics.

        - alert: KMECgroupPollStale
          expr: time() - kme_cgroup_last_poll_timestamp_seconds > 90
          for: 5m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Cgroup polling stale on {{ $labels.instance }}"
            description: >-
              The cgroup subsystem has not completed a poll cycle in over 90 seconds.
              VMI memory and kernel thread CPU metrics from this node may be stale.

        - alert: KMECgroupScrapeErrors
          expr: |
            rate(kme_cgroup_scrape_errors_total[15m]) > 0.1
          for: 15m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "Sustained cgroup scrape errors on {{ $labels.instance }}"
            description: >-
              The exporter is logging persistent cgroup scrape errors
              (>0.1/s over 15 minutes). Some VMIs may be missing memory metrics.

        - alert: KMEeBPFSubsystemDown
          expr: kme_subsystem_active{subsystem="block"} == 0
          for: 10m
          labels:
            severity: warning
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "eBPF block subsystem down on {{ $labels.instance }}"
            description: >-
              The block eBPF subsystem failed to load or has stopped.
              Node-side block I/O latency metrics are missing.

        - alert: KMEAbsent
          expr: absent(up{job="kubevirt-metrics-exporter"} == 1)
          # job label is set via jobLabel: app in the PodMonitor
          for: 10m
          labels:
            severity: critical
            kubernetes_operator_part_of: kubevirt
            kubernetes_operator_component: kubevirt-metrics-exporter
            operator_health_impact: none
            namespace: kubevirt-metrics-exporter
          annotations:
            summary: "kubevirt-metrics-exporter is down"
            description: >-
              No kubevirt-metrics-exporter metrics are being scraped. The
              DaemonSet may be down or the PodMonitor/scrape config broken.
